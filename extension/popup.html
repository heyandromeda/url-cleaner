<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Cleaner</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <p class="eyebrow">LOCAL UTILITY</p>
      <h1>URL Cleaner</h1>
      <p id="status" class="status" role="status"></p>
      <p id="cleaned" class="url" hidden></p>
      <p id="summary" class="summary" hidden></p>
      <p id="warning" class="notice" hidden></p>
      <a id="open-site" class="open-site" hidden rel="noopener noreferrer" target="_blank">Open in URL Cleaner</a>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
